# Compiles the generated Honk verifiers. This profile is the one the LIVE verifiers were built with
# — proven, not assumed: scripts/check-verifier-bytecode.mjs rebuilds evm/src/*.sol under it, links
# the pinned libraries, fills the immutables from the source constants, and gets the pinned on-chain
# codehash back byte-for-byte, metadata included. That proof is only as good as this
# profile staying fixed, hence the explicit solc pin below. evm_version is cancun (shanghai costs
# ~31k more gas).
#
# Note for anyone redeploying: the chain was built from the renamed copies in evm/src/ (contract
# HonkVerifier_<name>), not from circuits/verifiers/<name>/Verifier.sol. The two differ only in the
# contract-name line, but that line is in the metadata hash, so only evm/src/ reproduces the pin.
[profile.default]

src = "evm/src"
test = "evm/test"
out = "evm/out"
cache_path = "evm/cache"
libs = []
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
